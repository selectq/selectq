<div class="glass-card form-card">
  <h2>{{ isEditMode ? 'Edit Business Partner' : 'New Business Partner' }}</h2>
  <p class="subtitle">{{ isEditMode ? 'Update the details for this client or vendor.' : 'Configure a new client or vendor.' }}</p>

  <form [formGroup]="bpForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="name">Business Partner Name *</label>
      <input id="name" type="text" formControlName="name" placeholder="e.g. Acme Corp" />
      
      <!-- Duplicate Warning -->
      <div class="duplicate-warning" *ngIf="similarPartners.length > 0">
        <span class="warning-icon">⚠️</span>
        <div class="warning-content">
          <strong>Similar partners found:</strong>
          <ul>
            <li *ngFor="let p of similarPartners">{{ p.name }}</li>
          </ul>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="address">Billing Address</label>
      <textarea id="address" formControlName="billing_address" rows="3" placeholder="123 Business St..."></textarea>
    </div>

    <div class="form-row">
      <div class="form-group half">
        <label for="currency">Invoice Currency *</label>
        <select id="currency" formControlName="invoice_currency">
          <option value="USD">USD</option>
          <option value="INR">INR</option>
          <option value="GBP">GBP</option>
          <option value="EUR">EUR</option>
        </select>
      </div>

      <div class="form-group half">
        <label for="tax">Tax Information</label>
        <input id="tax" type="text" formControlName="tax_information" placeholder="GSTIN / VAT ID / EIN" />
      </div>
    </div>

    <!-- Contacts Section -->
    <div class="contacts-section">
      <div class="contacts-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; margin-top: 24px;">
        <h3 style="margin: 0; font-size: 1.1rem; color: #1e293b;">Contacts</h3>
        <button type="button" class="btn-secondary" style="padding: 6px 12px; font-size: 13px;" (click)="addContact()">+ Add Contact</button>
      </div>

      <div formArrayName="contacts">
        <div *ngFor="let contact of contacts.controls; let i=index" [formGroupName]="i" class="contact-card" style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 16px; position: relative; background: #fafbfc;">
          
          <button type="button" *ngIf="contacts.length > 1" (click)="removeContact(i)" style="position: absolute; top: 12px; right: 12px; background: none; border: none; color: #ef4444; cursor: pointer; font-size: 20px; line-height: 1;" title="Remove Contact">&times;</button>

          <div class="form-group">
            <label>Contact Name *</label>
            <input type="text" formControlName="name" placeholder="John Doe" />
          </div>

          <div class="form-row" style="margin-top: 12px;">
            <div class="form-group half">
              <label>Email</label>
              <input type="email" formControlName="email" placeholder="john@example.com" />
            </div>
            <div class="form-group half">
              <label>Phone</label>
              <input type="text" formControlName="phone" placeholder="+1 234 567 8900" />
            </div>
          </div>
          <div class="form-row" style="margin-top: 12px;">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
              <input type="radio" name="primaryContact" [checked]="contact.get('is_primary')?.value" (change)="setPrimary(i)" style="width: auto; margin: 0;" />
              <span style="font-size: 13px; font-weight: 500; color: #334155;">Set as Primary Contact</span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-cancel" (click)="cancel()">Cancel</button>
      <button type="submit" class="btn-primary" [disabled]="bpForm.invalid || isSubmitting">
        {{ isSubmitting ? 'Saving...' : 'Save Partner' }}
      </button>
    </div>
  </form>
</div>
