<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc">
<title id="title">04 / Business partner address versions</title><desc id="desc">Invoices retain one address version. Corrections insert a new row; archiving preserves historical invoice links. Relationships show cardinality at each end. PK means primary key; FK means foreign key; UQ means unique.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172b4d} .title{font-size:28px;font-weight:700} .sub{font-size:15px;fill:#52657c} .entity{font-size:19px;font-weight:600;fill:white} .field{font-family:Consolas,monospace;font-size:15px} .label{font-size:14px;fill:#254e70;paint-order:stroke;stroke:#f4f7fb;stroke-width:6px;stroke-linejoin:round} .note{font-size:15px;fill:#354a62}</style>
<rect width="1200" height="930" fill="#f4f7fb"/>
<text x="40" y="48" class="title">04 / Business partner address versions</text><text x="40" y="78" class="sub">Invoices retain one address version. Corrections insert a new row; archiving preserves historical invoice links.</text>
<path d="M425 210 H285 V400" fill="none" stroke="#66849d" stroke-width="2"/>
<text x="397" y="199" text-anchor="middle" class="label">1</text>
<text x="310" y="387" text-anchor="middle" class="label">0..*</text>
<text x="281" y="291" text-anchor="middle" class="label">owns address versions</text>
<path d="M775 210 H965 V400" fill="none" stroke="#66849d" stroke-width="2"/>
<text x="801" y="199" text-anchor="middle" class="label">1</text>
<text x="989" y="387" text-anchor="middle" class="label">0..*</text>
<text x="965" y="291" text-anchor="middle" class="label">owns invoices</text>
<path d="M520 535 H780" fill="none" stroke="#66849d" stroke-width="2"/>
<text x="548" y="524" text-anchor="middle" class="label">0..1</text>
<text x="752" y="524" text-anchor="middle" class="label">0..*</text>
<text x="650" y="571" text-anchor="middle" class="label">selected address version</text>
<path d="M50 560 H20 V705 H300 V643" fill="none" stroke="#66849d" stroke-width="2"/>
<text x="78" y="660" text-anchor="middle" class="label">0..1 prior</text>
<text x="346" y="650" text-anchor="middle" class="label">0..1 successor</text>
<text x="189" y="732" text-anchor="middle" class="label">previous_address_id + unique index</text>
<rect x="425" y="125" width="350" height="108" rx="10" fill="white" stroke="#c6d4e1"/>
<path d="M435 125 H765 Q775 125 775 135 V167 H425 V135 Q425 125 435 125" fill="#215b88"/>
<text x="441" y="153" class="entity">business_partners</text>
<text x="441" y="193" class="field">PK id</text>
<text x="441" y="220" class="field">UQ name</text>
<rect x="50" y="400" width="470" height="243" rx="10" fill="white" stroke="#c6d4e1"/>
<path d="M60 400 H510 Q520 400 520 410 V442 H50 V410 Q50 400 60 400" fill="#6952a3"/>
<text x="66" y="428" class="entity">bp_addresses</text>
<text x="66" y="468" class="field">PK id (AUTOINCREMENT)</text>
<text x="66" y="495" class="field">FK business_partner_id</text>
<text x="66" y="522" class="field">address (immutable text)</text>
<text x="66" y="549" class="field">gstin (immutable, optional)</text>
<text x="66" y="576" class="field">FK previous_address_id (nullable)</text>
<text x="66" y="603" class="field">is_archived</text>
<text x="66" y="630" class="field">created_at</text>
<rect x="780" y="400" width="370" height="216" rx="10" fill="white" stroke="#c6d4e1"/>
<path d="M790 400 H1140 Q1150 400 1150 410 V442 H780 V410 Q780 400 790 400" fill="#087e83"/>
<text x="796" y="428" class="entity">sales_invoices</text>
<text x="796" y="468" class="field">PK id</text>
<text x="796" y="495" class="field">FK business_partner_id</text>
<text x="796" y="522" class="field">FK address_id (nullable)</text>
<text x="796" y="549" class="field">invoice_number / invoice_date</text>
<text x="796" y="576" class="field">seller_gstin (snapshot)</text>
<text x="796" y="603" class="field">gst_treatment</text>
<text x="50" y="798" class="note">Editing active address #10 creates #11 with previous_address_id = 10 and archives #10.</text>
<text x="50" y="825" class="note">Existing invoices keep #10. New selections require an active address owned by the invoice partner.</text>
<text x="50" y="852" class="note">An invoice may have no address only for an addressless partner or a retained legacy invoice.</text>
<text x="50" y="879" class="note">Address text and GSTIN are versioned together; invoices retain seller GSTIN and the selected tax treatment.</text>
<text x="40" y="906" class="sub">PK primary key · FK foreign key · UQ unique · 1 exactly one · 0..1 optional · 0..* zero or many</text></svg>